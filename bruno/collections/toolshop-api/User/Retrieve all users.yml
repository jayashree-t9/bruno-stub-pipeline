  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/users"
      method: GET
      params:
        - name: page
          value: ""
          type: query
          description: pagenumber
          disabled: true
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Returns when user is not authenticated
    request:
      url: "{{baseUrl}}/users"
      method: GET
      params:
        - name: page
          value: ""
          type: query
          description: pagenumber
          disabled: true
    response:
      status: 401
