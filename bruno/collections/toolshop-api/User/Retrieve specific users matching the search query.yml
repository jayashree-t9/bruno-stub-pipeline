info:
  name: Retrieve specific users matching the search query
  type: http
  seq: 13
  tags:
    - User

http:
  method: GET
  url: "{{baseUrl}}/users/search"
  params:
    - name: q
      value: ""
      type: query
      description: A query phrase
    - name: page
      value: ""
      type: query
      description: pagenumber
      disabled: true
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful operation
    request:
      url: "{{baseUrl}}/users/search"
      method: GET
      params:
        - name: q
          value: ""
          type: query
          description: A query phrase
        - name: page
          value: ""
          type: query
          description: pagenumber
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "first_name": "John",
              "last_name": "Doe",
              "address": {
                "street": "Street 1",
                "house_number": "12",
                "city": "City",
                "state": "State",
                "country": "Country",
                "postal_code": "1234AA"
              },
              "phone": "0987654321",
              "dob": "1970-01-01",
              "email": "john@doe.example",
              "id": "",
              "provider": "",
              "totp_enabled": false,
              "enabled": false,
              "failed_login_attempts": "",
              "created_at": "2022-08-01 08:24:56"
            }
          ]
  - name: 401 Response
    description: Returns when user is not authenticated
    request:
      url: "{{baseUrl}}/users/search"
      method: GET
      params:
        - name: q
          value: ""
          type: query
          description: A query phrase
        - name: page
          value: ""
          type: query
          description: pagenumber
          disabled: true
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Unauthorized"
          }
  - name: 404 Response
    description: Returns when the resource is not found
    request:
      url: "{{baseUrl}}/users/search"
      method: GET
      params:
        - name: q
          value: ""
          type: query
          description: A query phrase
        - name: page
          value: ""
          type: query
          description: pagenumber
          disabled: true
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Requested item not found"
          }

docs: Search is performed on the `first_name`, `last_name`, or `city` column
