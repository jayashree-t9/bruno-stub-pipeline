info:
  name: Request a new password
  type: http
  seq: 4
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/users/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "customer@practicesoftwaretesting.com"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Result of the update
    request:
      url: "{{baseUrl}}/users/forgot-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "customer@practicesoftwaretesting.com"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/users/forgot-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "customer@practicesoftwaretesting.com"
          }
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Returns when user is not authenticated
    request:
      url: "{{baseUrl}}/users/forgot-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "customer@practicesoftwaretesting.com"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Unauthorized"
          }
  - name: 403 Response
    description: Forbidden
    request:
      url: "{{baseUrl}}/users/forgot-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "email": "customer@practicesoftwaretesting.com"
          }
    response:
      status: 403
      statusText: Forbidden
      body:
        type: text
        data: ""

docs: Request a new password, it actually sets the password to `welcome02`
