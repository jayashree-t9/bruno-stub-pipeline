info:
  name: Change password
  type: http
  seq: 5
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/users/change-password"
  body:
    type: json
    data: |-
      {
        "current_password": "welcome01",
        "new_password": "welcome02",
        "new_password_confirmation": "welcome02"
      }
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Result of the update
    request:
      url: "{{baseUrl}}/users/change-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "current_password": "welcome01",
            "new_password": "welcome02",
            "new_password_confirmation": "welcome02"
          }
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "success": true
          }
  - name: 401 Response
    description: Returns when user is not authenticated
    request:
      url: "{{baseUrl}}/users/change-password"
      method: POST
      body:
        type: json
        data: |-
          {
            "current_password": "welcome01",
            "new_password": "welcome02",
            "new_password_confirmation": "welcome02"
          }
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Unauthorized"
          }

docs: Change the existing password to a new one
