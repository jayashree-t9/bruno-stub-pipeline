info:
  name: Store new user
  type: http
  seq: 2
  tags:
    - User

http:
  method: POST
  url: "{{baseUrl}}/users/register"
  body:
    type: json
    data: |-
      {
        "first_name": "John",
        "last_name": "Doe",
        "address": {
          "street": "Street 1",
          "house_number": "12",
          "city": "City",
          "state": "State",
          "country": "Country",
          "postal_code": "1234AA"
        },
        "phone": "0987654321",
        "dob": "1970-01-01",
        "password": "SuperSecure@123",
        "email": "john@doe.example"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Successful operation
    request:
      url: "{{baseUrl}}/users/register"
      method: POST
      body:
        type: json
        data: |-
          {
            "first_name": "John",
            "last_name": "Doe",
            "address": {
              "street": "Street 1",
              "house_number": "12",
              "city": "City",
              "state": "State",
              "country": "Country",
              "postal_code": "1234AA"
            },
            "phone": "0987654321",
            "dob": "1970-01-01",
            "password": "SuperSecure@123",
            "email": "john@doe.example"
          }
    response:
      status: 201
      statusText: Created
      headers:
