info:
  name: Retrieve specific user
  type: http
  seq: 9
  tags:
    - User

http:
  method: GET
  url: "{{baseUrl}}/users/:userId"
  params:
    - name: userId
      value: "1"
      type: path
      description: The userId parameter in path
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

