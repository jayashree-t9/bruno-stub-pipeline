info:
  name: Logout - invalidate the token
  type: http
  seq: 7
  tags:
    - User

http:
  method: GET
  url: "{{baseUrl}}/users/logout"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Result of logout
    request:
      url: "{{baseUrl}}/users/logout"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Successfully logged out"
          }
  - name: 400 Response
    description: Bad Request
    request:
      url: "{{baseUrl}}/users/logout"
      method: GET
    response:
      status: 400
      statusText: Bad Request
      body:
        type: text
        data: ""
  - name: 401 Response
    description: Returns when user is not authenticated
    request:
      url: "{{baseUrl}}/users/logout"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Unauthorized"
          }

docs: Logout - invalidate the token
