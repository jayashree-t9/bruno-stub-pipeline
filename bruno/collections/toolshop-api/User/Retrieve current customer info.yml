info:
  name: Retrieve current customer info
  type: http
  seq: 6
  tags:
    - User

http:
  method: GET
  url: "{{baseUrl}}/users/me"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: A customer
    request:
      url: "{{baseUrl}}/users/me"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "first_name": "John",
            "last_name": "Doe",
            "address": {
              "street": "Street 1",
              "house_number": "12",
              "city": "City",
              "state": "State",
              "country": "Country",
              "postal_code": "1234AA"
            },
            "phone": "0987654321",
            "dob": "1970-01-01",
            "email": "john@doe.example",
            "id": "",
            "provider": "",
            "totp_enabled": false,
            "enabled": false,
            "failed_login_attempts": "",
            "created_at": "2022-08-01 08:24:56"
          }
  - name: 401 Response
    description: Returns when user is not authenticated
    request:
      url: "{{baseUrl}}/users/me"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Unauthorized"
          }
