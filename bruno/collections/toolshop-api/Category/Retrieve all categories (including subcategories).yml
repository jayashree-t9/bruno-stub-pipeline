info:
  name: Retrieve all categories (including subcategories)
  type: http
  seq: 1
  tags:
    - Category

http:
  method: GET
  url: "{{baseUrl}}/categories/tree"
  params:
    - name: by_category_slug
      value: ""
      type: query
      description: Parent category slug
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 200 Response
    description: Successful operation
    request:
      url: "{{baseUrl}}/categories/tree"
      method: GET
      params:
        - name: by_category_slug
          value: ""
          type: query
          description: Parent category slug
          disabled: true
    response:
      status: 200
      statusText: OK
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          [
            {
              "id": "",
              "parent_id": "",
              "name": "new category",
              "slug": "new-category",
              "sub_categories": [
                {
                  "id": "",
                  "parent_id": "",
                  "name": "new category",
                  "slug": "new-category",
                  "sub_categories": []
                }
              ]
            }
          ]
  - name: 404 Response
    description: Returns when the resource is not found
    request:
      url: "{{baseUrl}}/categories/tree"
      method: GET
      params:
        - name: by_category_slug
          value: ""
          type: query
          description: Parent category slug
          disabled: true
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Resource not found"
          }
  - name: 405 Response
    description: Returns when the method is not allowed for the requested route
    request:
      url: "{{baseUrl}}/categories/tree"
      method: GET
      params:
        - name: by_category_slug
          value: ""
          type: query
          description: Parent category slug
          disabled: true
    response:
      status: 405
      statusText: Method Not Allowed
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Method is not allowed for the requested route"
          }

