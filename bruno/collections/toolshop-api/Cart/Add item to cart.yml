  url: "{{baseUrl}}/carts/:id"
  params:
    - name: id
      value: ""
      type: path
      description: Cart ID
  body:
    type: json
    data: |-
      {
        "product_id": "01HHJC7RERZ0M3VDGS6X9HM33A",
        "quantity": 1
      }
  auth: inherit

settings:
