info:
  name: Store new brand
  type: http
  seq: 2
  tags:
    - Brand

http:
  method: POST
  url: "{{baseUrl}}/brands"
  body:
    type: json
    data: |-
      {
        "name": "new brand",
        "slug": "new-brand"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: 201 Response
    description: Successful operation
    request:
      url: "{{baseUrl}}/brands"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "new brand",
            "slug": "new-brand"
          }
    response:
      status: 201
      statusText: Created
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "id": "",
            "name": "new brand",
            "slug": "new-brand"
          }
  - name: 404 Response
    description: Returns when the resource is not found
    request:
      url: "{{baseUrl}}/brands"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "new brand",
            "slug": "new-brand"
          }
    response:
      status: 404
      statusText: Not Found
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Requested item not found"
          }
  - name: 405 Response
    description: Returns when the method is not allowed for the requested route
    request:
      url: "{{baseUrl}}/brands"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "new brand",
            "slug": "new-brand"
          }
    response:
      status: 405
      statusText: Method Not Allowed
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "message": "Method is not allowed for the requested route"
          }
  - name: 409 Response
    description: The resource conflicts with an existing one (e.g. unique slug already taken). Body is either a field-level MessageBag (when caught by validation) or a single message (when caught by the Handler from a race / FormRequest bypass).
    request:
      url: "{{baseUrl}}/brands"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "new brand",
            "slug": "new-brand"
          }
    response:
      status: 409
      statusText: Conflict
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: ""
  - name: 422 Response
    description: Returns when the server was not able to process the content
    request:
      url: "{{baseUrl}}/brands"
      method: POST
      body:
        type: json
        data: |-
          {
            "name": "new brand",
            "slug": "new-brand"
          }
    response:
      status: 422
      statusText: Unprocessable Entity
      body:
        type: text
        data: ""

