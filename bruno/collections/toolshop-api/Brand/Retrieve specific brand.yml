info:
  name: Retrieve specific brand
  type: http
  seq: 3
  tags:
    - Brand

http:
  method: GET
  url: "{{baseUrl}}/brands/:brandId"
  params:
    - name: brandId
      value: "1"
      type: path
      description: The brandId parameter in path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

